*{box-sizing:border-box}html{background:#f6f2e9;color:#272519;font:16px/1.48 system-ui,sans-serif}body{margin:0}.mast{padding:15px max(4vw,calc((100vw - 1080px)/2));background:#263d33;color:white;display:flex;align-items:center;gap:12px;white-space:nowrap;font-weight:750}.mark{display:inline-block;border:2px solid #f2b869;padding:1px 8px;border-radius:7px;color:#f2b869}.wrap{max-width:1110px;margin:auto;padding:26px 20px 60px}.k{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:#745333}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;line-height:1.05;letter-spacing:-.035em}h1{font-size:clamp(34px,5vw,62px);margin:8px 0 10px}h2{font-size:clamp(25px,3.2vw,40px);margin:8px 0 16px}h3{font-size:1rem}.muted,small{color:#555d51}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:16px;margin-top:22px}article,aside{background:#fffcf5;border:1px solid #d9d4c6;border-radius:18px;padding:clamp(16px,3vw,30px)}aside{align-self:start;padding:20px}.fields,.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label{font-size:.92rem;font-weight:650;display:block}input{font:inherit;width:100%;padding:11px;border:1px solid #a9aa9c;border-radius:7px;background:white;color:inherit;margin-top:5px}input::placeholder{color:#72776d;font-weight:400}button{font:inherit;cursor:pointer;border:1px solid #a7ada3;border-radius:8px;background:white;color:#233b30;padding:8px 12px;font-weight:650}button:hover,button:focus-visible{outline:2px solid #b78043;outline-offset:1px}button.active,.primary{background:#254438;color:white;border-color:#254438}button:disabled{opacity:.52;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.note{margin:14px 0;padding:10px 13px;background:#efefe2;border-left:3px solid #998454;font-size:.86rem}.navrow{border-top:1px solid #ddd8ca;margin-top:12px;padding-top:10px}.navrow button{margin:6px 4px 0 0;font-size:.82rem;min-width:42px}.navrow small{display:block}.badge{display:inline </style><header class="mast"><span class="mark">V</span> Vitrine Vidéo <span style="font-weight:400">/ Commerce T2</span> <a href="film.html" style="color:inherit;margin-left:auto">Voir le film</a></header><main class="wrap"><div class="k">Atelier de prise · Maquette à valider</div><h1>Nouvel arrivage</h1><p>Un article. Quatre prises. Du premier regard à l’envie de commander.</p><div class="layout"><article id="card"></article><aside><div class="k">Sommaire de visite</div><h3>Explorer sans saisir</h3><small>A · Guide &nbsp; B · Enregistrement &nbsp; C · Vérification</small><div class="actions"><button onclick="go(-1)">Les six questions</button></div><div id="nav"></div></aside></div></main><script>
const Q={"titre": "PRÉPARE TA PUBLICITÉ — NOUVEL ARRIVAGE", "champs": [{"cle": "nom", "question": "Comment s'appelle ton commerce ?", "exemple": "Boutique Élégance"}, {"cle": "produit", "question": "Quel nouvel article veux-tu présenter ?", "exemple": "Sac à main pour femme"}, {"cle": "prix", "question": "Quel est son prix ?", "exemple": "8 000 FCFA"}, {"cle": "accroche", "question": "Quel message veux-tu donner aux clients ?", "exemple": "Nos nouveaux sacs sont disponibles !"}, {"cle": "quartier", "question": "Où peut-on te trouver ?", "exemple": "Cotonou, Akpakpa"}, {"cle": "whatsapp", "question": "Quel est ton numéro WhatsApp ?", "exemple": "+229 XX XX XX XX"}], "regles": ["Six réponses obligatoires. Les exemples ne sont pas préremplis.", "Un seul article, pas une liste de produits.", "Le prix et sa devise sont saisis librement et conservés tels quels.", "Le numéro masqué est un exemple, pas un contact valide."]},S={"template_id": "COMMERCE-T2", "article_unique": true, "source_questions": "form/questions.json", "ecrans": [{"numero": 1, "scene": 1, "etat": "A", "duree_proposee_s": 6, "titre": "TON NOUVEL ARTICLE EST ARRIVÉ !", "blocs": [{"label": "Ce que tu vas filmer", "texte": "Présente le nouvel article que tu viens de recevoir. Montre-le en entier pour que les clients voient bien ce que tu proposes."}, {"label": "À filmer", "texte": "L'article en entier ; sa forme et son apparence ; une belle vue de face."}, {"label": "À éviter", "texte": "Cacher une partie de l'article ; filmer de trop loin ; bouger le téléphone trop vite."}, {"label": "Ce que tu dois faire", "texte": "Place ton article devant ton téléphone. Filme-le en entier pour qu'on puisse bien le voir."}, {"label": "Tu peux parler pendant que tu filmes", "texte": "Tu peux parler dans la langue que tu veux : fon, yoruba, français, anglais ou toute autre langue que tu maîtrises. Tu peux aussi ne pas parler."}, {"label": "Exemple de ce que tu peux dire", "texte": "« Nous venons de recevoir cet article. Regarde-le bien ! »"}], "boutons": ["Commencer à filmer"]}, {"numero": 2, "scene": 1, "etat": "B", "duree_proposee_s": 6, "titre": "SCÈNE 1 SUR 4", "consigne": "Garde ton article dans l'image.", "indicateurs": ["REC", "Aperçu caméra", "Barre de progression"], "arret": "automatique"}, {"numero": 3, "scene": 1, "etat": "C", "duree_proposee_s": 6, "titre": "REGARDE TA VIDÉO", "consigne": "Vérifie que ton article est bien visible. Écoute aussi le son de ta vidéo.", "boutons": ["Relire avec le son", "Refaire", "Accepter"], "suivant": 4, "verification_avant_suite": true}, {"numero": 4, "scene": 2, "etat": "A", "duree_proposee_s": 8, "titre": "REGARDE BIEN LES DÉTAILS", "blocs": [{"label": "Ce que tu vas filmer", "texte": "Approche ton téléphone pour montrer les détails de ton article. Fais voir les parties que les clients ne voient pas bien de loin."}, {"label": "À filmer", "texte": "Les détails de près ; les différentes parties ; les belles finitions."}, {"label": "À éviter", "texte": "Cacher les détails ; approcher trop vite ; faire une vidéo floue."}, {"label": "Ce que tu dois faire", "texte": "Rapproche doucement ton téléphone. Fais voir les détails un par un et garde l'image bien nette."}, {"label": "Tu peux parler pendant que tu filmes", "texte": "Tu peux parler dans la langue que tu veux : fon, yoruba, français, anglais ou toute autre langue que tu maîtrises. Tu peux aussi ne pas parler."}, {"label": "Exemple de ce que tu peux dire", "texte": "« Regarde bien les détails de cet article. »"}], "boutons": ["Commencer à filmer"]}, {"numero": 5, "scene": 2, "etat": "B", "duree_proposee_s": 8, "titre": "SCÈNE 2 SUR 4", "consigne": "Approche doucement ton téléphone.", "indicateurs": ["REC", "Aperçu caméra", "Barre de progression"], "arret": "automatique"}, {"numero": 6, "scene": 2, "etat": "C", "duree_proposee_s": 8, "titre": "REGARDE TA VIDÉO", "consigne": "Vérifie que les détails de ton article sont bien visibles. Écoute aussi le son.", "boutons": ["Relire avec le son", "Refaire", "Accepter"], "suivant": 7, "verification_avant_suite": true}, {"numero": 7, "scene": 3, "etat": "A", "duree_proposee_s": 7, "titre": "MONTRE COMMENT ON L'UTILISE", "blocs": [{"label": "Ce que tu vas filmer", "texte": "Tu as 7 secondes. Montre comment tu utilises ton article : filme seulement le geste le plus important et son résultat."}, {"label": "À filmer", "texte": "Le geste principal ; ton article pendant son utilisation ; ce qui se passe quand on s'en sert."}, {"label": "À éviter", "texte": "Cacher l'article ; faire un geste trop rapide ; montrer quelque chose qui ne correspond pas à son utilisation."}, {"label": "Ce que tu dois faire", "texte": "Utilise ton article normalement et filme ce qui se passe. Garde ton téléphone stable pour qu'on voie bien le geste."}, {"label": "Tu peux parler pendant que tu filmes", "texte": "Tu peux parler dans la langue que tu veux : fon, yoruba, français, anglais ou toute autre langue que tu maîtrises. Tu peux aussi ne pas parler."}, {"label": "Exemple de ce que tu peux dire", "texte": "« Je vais te montrer comment on s'en sert. »"}], "boutons": ["Commencer à filmer"]}, {"numero": 8, "scene": 3, "etat": "B", "duree_proposee_s": 7, "titre": "SCÈNE 3 SUR 4", "consigne": "Montre comment tu utilises ton article.", "indicateurs": ["REC", "Aperçu caméra", "Barre de progression"], "arret": "automatique"}, {"numero": 9, "scene": 3, "etat": "C", "duree_proposee_s": 7, "titre": "REGARDE TA VIDÉO", "consigne": "Vérifie qu'on voit bien comment on utilise ton article. Écoute aussi le son.", "boutons": ["Relire avec le son", "Refaire", "Accepter"], "suivant": 10, "verification_avant_suite": true}, {"numero": 10, "scene": 4, "etat": "A", "duree_proposee_s": 9, "titre": "FAIS UNE DERNIÈRE BELLE PRÉSENTATION", "blocs": [{"label": "Ce que tu vas filmer", "texte": "Montre encore une fois ton article. Fais une belle présentation pour que les clients le voient bien avant de terminer."}, {"label": "À filmer", "texte": "Ton article en entier ; son meilleur côté ; une belle vue finale."}, {"label": "À éviter", "texte": "Cacher l'article ; filmer dans un endroit sombre ; remplacer l'article par un autre."}, {"label": "Ce que tu dois faire", "texte": "Place bien ton article devant ton téléphone. Filme-le tranquillement et garde une belle image jusqu'à la fin."}, {"label": "Tu peux parler pendant que tu filmes", "texte": "Tu peux parler dans la langue que tu veux : fon, yoruba, français, anglais ou toute autre langue que tu maîtrises. Tu peux aussi ne pas parler."}, {"label": "Exemple de ce que tu peux dire", "texte": "« Cet article est disponible. Écris-nous sur WhatsApp pour commander ! »"}], "boutons": ["Commencer à filmer"]}, {"numero": 11, "scene": 4, "etat": "B", "duree_proposee_s": 9, "titre": "SCÈNE 4 SUR 4", "consigne": "Garde ton article bien visible jusqu'à la fin.", "indicateurs": ["REC", "Aperçu caméra", "Barre de progression"], "arret": "automatique"}, {"numero": 12, "scene": 4, "etat": "C", "duree_proposee_s": 9, "titre": "TON DERNIER ENREGISTREMENT EST TERMINÉ !", "consigne": "Regarde ta vidéo une dernière fois. Vérifie que ton article est bien présenté.", "boutons": ["Relire avec le son", "Refaire", "Voir mon montage"], "suivant": "synthèse de montage", "verification_avant_suite": true}]}.ecrans,card=document.querySelector('#card'),names=['Le nouvel article','Les détails','En utilisation','Présentation finale'];let idx=-1,flow=false,visited=new Set(),values={},files=Array(4).fill(''),seen=Array(4).fill(false),ok=Array(4).fill(false),tick=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(txt,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${txt}</button>`;function nav(){document.querySelector('#nav').innerHTML=names.map((n,i)=>`<div class="navrow"><strong>${i+1} · ${n}</strong><small>${S[3*i].duree_proposee_s} secondes</small>${['A','B','C'].map((k,j)=>btn(k,`go(${3*i+j})`,idx==3*i+j?'active':'')).join('')}</div>`).join('')}
function go(i){window.t2job=null;flow=false;draw(i)}function draw(i){clearInterval(tick);idx=i;if(flow&&i>=0)visited.add(i+1);nav();if(i<0){card.innerHTML=`<div class="k">Avant la scène 1</div><h2>Prépare ta publicité</h2><p class="muted">Nouvel arrivage · Six réponses sur un seul article.</p><div class="note">Les exemples sont des indications, pas des réponses. Pour le prix, écris le montant avec ta devise.</div><form id="f"><div class="fields">${Q.champs.map((q,j)=>`<label>${j+1}. ${esc(q.question)}<input required name="${q.cle}" ${q.cle==='whatsapp'?'type="tel"':''} placeholder="Ex. : ${esc(q.exemple)}" value="${esc(values[q.cle]||'')}"></label>`).join('')}</div><div class="actions"><button class="primary">Commencer le parcours →</button>${'<button type="button" onclick="go(0)">Voir les 12 écrans sans répondre</button>'}</div></form><small>Essai local : rien n’est envoyé. Pas d’accès caméra ou microphone.</small>`;const f=document.querySelector('#f');f.oninput=e=>{values[e.target.name]=e.target.value;e.target.setCustomValidity('')};f.onsubmit=e=>{e.preventDefault();for(const q of Q.champs){const el=f.elements[q.cle];if(!el.value.trim()||(q.cle==='whatsapp'&&!/^\+?\d{7,15}$/.test(el.value.replace(/[\s()-]/g,'')))){el.setCustomValidity(q.cle==='whatsapp'?'Entre un numéro, pas le masque d’exemple.':'Réponse obligatoire.');el.reportValidity();return}}visited.clear();files.forEach(u=>{if(u)URL.revokeObjectURL(u)});files.fill('');flow=true;ok.fill(false);seen.fill(false);draw(0)};return}
const n=Math.floor(i/3),s=S[i],d=s.duree_proposee_s;let top=`<div class="k">${flow?'Parcours d’essai':'Visite libre'} · Écran ${String(i+1).padStart(2,'0')}/12</div><div class="stage"><span class="badge">Scène ${n+1}/4 · ${s.etat} / ${{A:'Guide',B:'Enregistrement',C:'Vérification'}[s.etat]}</span> <small>${d} s proposées</small></div>`;const block=b=>`<div class="box"><h3>${esc(b.label)}</h3><p>${esc(b.texte)}</p></div>`;
if(s.etat==='A'){const b=s.blocs;card.innerHTML=top+`<h2>${esc(s.titre)}</h2><h3>${esc(b[0].label)}</h3><p>${esc(b[0].texte)}</p><div class="pair">${[1,2].map(z=>`<div class="box"><h3>${b[z].label}</h3><ul>${b[z].texte.split(' ; ').map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}</div>${b.slice(3).map(block).join('')}<div class="actions">${btn(s.boutons[0]+' →',`start(${i+1})`,'primary')}</div><small>Simulation du chronomètre, sans enregistrement réel.</small>`;return}
const img=`<svg viewBox="0 0 400 200" aria-label="Illustration de sac, pas une capture caméra"><rect width="400" height="200" fill="#e5cfb4"/><ellipse cx="200" cy="174" rx="90" ry="9" fill="#c7ac88"/><g transform="translate(200,106) scale(${[1,1.55,1.18,.98][n]})"><path d="M-27,-32v-10a27,27 0 0 1 54,0v10" fill="none" stroke="#583a2c" stroke-width="7"/><path d="M-54,-33h108l12,88H-66z" fill="#a45635" stroke="#6e3b2b" stroke-width="3"/><path d="M-55,-29q54,69 110,0" fill="#bd714b" stroke="#794631" stroke-width="2"/><rect x="-7" y="-3" width="14" height="11" rx="4" fill="#e8bd68"/></g></svg>`;
if(s.etat==='B'){card.innerHTML=top+`<h2>${esc(s.consigne)}</h2><div class="player">${img}<span class="stamp">● REC · simulation</span><span class="clock" id="tm">00:${String(d).padStart(2,'0')}</span></div><progress id="bar" value="0" max="${d}"></progress><small>Illustration · Le compte à rebours passe automatiquement à la vérification.</small>`;let sec=d;tick=setInterval(()=>{sec--;document.querySelector('#tm').textContent='00:'+String(sec).padStart(2,'0');document.querySelector('#bar').value=d-sec;if(!sec)draw(i+1)},1000);return}
card.innerHTML=top+`<h2>${s.titre}</h2><p>${s.consigne}</p><div class="player">${files[n]?'<video controls playsinline src="'+files[n]+'"></video>':img}</div><details><summary>Essayer la relecture avec une vidéo personnelle</summary><input type="file" accept="video/*" id="upload"><small>Lecture locale uniquement. Aucun fichier envoyé.</small></details><div class="actions">${btn(s.boutons[0],`replay(${n})`)}${btn(s.boutons[1],`redo(${n})`)}</div><p id="notice" role="status" class="muted"></p><label><input class="inline" type="checkbox" id="inspect" ${seen[n]?'checked':''}>J’ai vérifié ${files[n]?'ma prise':'cet écran de démonstration'}.</label><div class="actions" id="next"></div>`;let check=document.querySelector('#inspect');function gate(){const allow=seen[n]&&(n!==3||!flow||ok.slice(0,3).every(Boolean));document.querySelector('#next').innerHTML=allow?btn(s.boutons[2]+(n===3?'':' →'),`acceptTake(${n})`,'primary'):''}check.onchange=()=>{seen[n]=check.checked;gate()};gate();document.querySelector('#upload').onchange=e=>{let f=e.target.files[0];if(f){if(files[n])URL.revokeObjectURL(files[n]);files[n]=URL.createObjectURL(f);seen[n]=false;ok[n]=false;draw(i)}}}
function replay(n){const v=card.querySelector('video');if(v){v.muted=false;v.currentTime=0;v.play().catch(()=>document.querySelector('#notice').textContent='Utilise les contrôles du lecteur.')}else document.querySelector('#notice').textContent='Aucun son dans l’illustration. Choisis une vidéo locale pour la relire avec son.'}
function start(i){seen[i/3|0]=false;draw(i)}function redo(n){ok[n]=seen[n]=false;if(files[n])URL.revokeObjectURL(files[n]);files[n]='';draw(n*3)}async function acceptTake(n){if(!seen[n])return;ok[n]=true;if(n<3){draw((n+1)*3);return}if(flow&&!ok.every(Boolean))return;
window.t2job=null;
if(flow&&files.every(Boolean)&&visited.size===12){
 const captures=await Promise.all(files.map(async (url,j)=>{const bytes=await (await fetch(url)).arrayBuffer();const hash=await crypto.subtle.digest('SHA-256',bytes);return {scene:'S'+(j+1),sha256:Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join(''),valide:true}}));
 if(new Set(captures.map(c=>c.sha256)).size===4)window.t2job={template_id:'COMMERCE-T2',reponses:{...values},captures,ecrans:[...visited]};
}
card.innerHTML=`<div class="k">Fin de la ${flow?'simulation':'visite'}</div><h2>${flow?'Aperçu des réponses':'Les 12 écrans'}</h2><p>${flow?'Les quatre scènes ont été vérifiées.':'Le parcours réel demandera les six réponses et quatre prises vérifiées.'} Aucun MP4 n’est généré par cette maquette.</p>${flow?Q.champs.map(q=>`<div class="box"><strong>${esc(q.question)}</strong><p>${esc(values[q.cle])}</p></div>`).join(''):''}<div class="actions">${window.t2job?btn('Télécharger le job de montage','exportJob()','primary'):''}${btn('Revenir aux questions','go(-1)')}</div><small>${window.t2job?'Pour le moteur : place job.json et les quatre fichiers MP4 importés, renommés S1.mp4 à S4.mp4, dans le même dossier. Rien n’est envoyé.':'Pour exporter un job, complète le formulaire et vérifie quatre prises MP4 distinctes.'}</small>`}function exportJob(){if(!window.t2job)return;const a=document.createElement('a');a.download='job.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(window.t2job,null,2)],{type:'application/json'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}draw(-1);
</script></html>
